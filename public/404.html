<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#415D60" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3" />
    <title>页面施工中</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f8f5;
        color: #1e2528;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 420px);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      a {
        color: #415d60;
        font-size: 14px;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>页面施工中</h1>
      <a href="./">返回首页</a>
    </main>
  </body>
</html>

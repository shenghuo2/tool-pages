name: Deploy index

on:
  push:
    branches: [index]
  workflow_dispatch:

permissions:
  contents: write

# 每个分支用独立的并发组，避免不同分支的部署互相取消；
# 同分支连续 push 时取消过时的旧 run。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # 导航页部署到站点根目录，并写入自定义域名 CNAME。
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          cname: tools.shenghuo2.top
